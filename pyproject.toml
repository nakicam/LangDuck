[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "langduck"
version = "0.0.1"
description = "Learning project: a small agent core, built step by step."
requires-python = "<4.0.0,>=3.11.0"
dependencies = ["langchain-core>=1.7,<2", "pydantic>=2.7,<3", "dotenv (>=0.9.9,<0.10.0)", "langchain (>=1.4.10,<2.0.0)", "langchain-openai (>=1.7.4,<2.0.0)", "langchain-groq (>=1.1.3,<2.0.0)"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 200
src = ["src", "tests"]
